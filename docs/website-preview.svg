<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Al Qaaf Restaurant website preview</title>
  <desc id="desc">Illustrated preview of the dark, copper-accented restaurant website, with a hero section, navigation, menu categories and dish cards.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset=".55" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#24170f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b87333" stop-opacity=".27"/>
      <stop offset="1" stop-color="#b87333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d79e"/>
      <stop offset="1" stop-color="#c58a43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

